
name = "dark-crm"
main = "workers/worker.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Cron Trigger configuration (run every 5 minutes for testing)
[triggers]
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = false

# Store sensitive variables as Cloudflare Secrets, not here.
